# Local PostgreSQL for development and tests.  Start: pnpm db:up   Stop: pnpm db:down
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: thunder_shop
    ports:
      # 5433 on your machine, so it does not clash with a Postgres you already run.
      # Bound to 127.0.0.1 only: the shop/shop login must not be reachable from other machines on your network.
      - '127.0.0.1:5433:5432'
    volumes:
      - thunder_shop_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d thunder_shop']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  thunder_shop_data:
